name: CI

on:
  push:
    branches: [main]
  pull_request:
  # quaso depends on nixpkgs-unstable, on four search backends nobody
  # here controls, and on Ollama's API shape. Any of them can break
  # without a commit, so the suite runs weekly whether or not anything
  # changed.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Declared rather than inherited: the repository default is read today
# and a settings change should not quietly hand these jobs a write
# token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: PEP 8 and lint rules
        run: ruff check src/ tests/
      - name: Formatting
        run: ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # The Linux sandbox cannot be exercised on a developer's Mac, so
      # this is where its escape tests actually run. Without bwrap the
      # backend reports itself unavailable and they skip silently, which
      # is a green tick meaning nothing.
      - name: Install bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 23.10 and later refuse unprivileged user namespaces,
          # which bwrap needs. Without this it is installed, starts, and
          # fails on every command with "setting up uid map".
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Confirm the Linux sandbox is testable
        run: |
          python -c "
          from quaso.execution.sandbox_linux import BubblewrapExecutor
          assert BubblewrapExecutor.available(), 'bwrap unusable; escape tests would skip'
          print('bubblewrap usable')
          "
      # The suite is offline: HTTP is mocked and the MCP client runs
      # against a local subprocess.
      - run: pytest -q

  # The flake cannot be built on a machine without Nix, which is most
  # machines including the one quaso is developed on. This is the only
  # place it is ever exercised.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned: a third-party action on a moving branch runs
      # whatever its author pushed, with this repository's token.
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Build the package
        run: nix build .#quaso --print-build-logs
      - name: Run it
        run: nix run .#quaso -- --version
      - name: Check the flake is well-formed
        run: nix flake check

  install-script:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to this commit rather than main, so a broken script
      # fails on the change that broke it.
      #
      # The venv method is forced: it is the path anyone without uv or
      # pipx takes, and it is the only one that installs somewhere this
      # job can name. Runners happen to ship pipx, so leaving it on auto
      # tested the one path most users will not take.
      - name: Install with the universal method
        run: |
          QUASO_INSTALLER=venv \
          QUASO_PREFIX="$RUNNER_TEMP/quaso-prefix" \
          QUASO_REF="$GITHUB_SHA" sh install.sh
      - name: The installed binary runs
        run: |
          "$RUNNER_TEMP/quaso-prefix/bin/quaso" --version
      # And the path a runner actually takes, which is whatever it has.
      - name: Install the way this machine would
        run: QUASO_REF="$GITHUB_SHA" sh install.sh
