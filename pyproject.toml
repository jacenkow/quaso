[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quaso"
dynamic = ["version"]
description = "An agent harness for open models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Grzegorz Jacenków" }]
keywords = ["llm", "agent", "cli", "ollama", "coding-assistant", "local-llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/jacenkow/quaso"
Repository = "https://github.com/jacenkow/quaso"
Issues = "https://github.com/jacenkow/quaso/issues"
Changelog = "https://github.com/jacenkow/quaso/blob/main/CHANGELOG.md"

[project.scripts]
quaso = "quaso.cli:main"

[tool.hatch.version]
path = "src/quaso/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/quaso"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
# B008: pydantic Field() in defaults is the intended idiom.
# B027: empty methods on the Provider and UI bases are optional hooks.
ignore = ["B008", "B027"]

[tool.ruff.lint.isort]
known-first-party = ["quaso"]

[tool.ruff.format]
# Preserve quotes so single-quoted dict access survives formatting.
quote-style = "preserve"
